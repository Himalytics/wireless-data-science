name: Verify data platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-${{ matrix.os }}
          path: reports/pytest.xml
