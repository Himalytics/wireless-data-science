[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-data-engineering"
version = "0.1.0"
description = "Real public telecom data, reproducible pipelines, and weekly engineering releases"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb==1.5.6", "polars==1.44.2", "requests==2.34.2",
  "dagster==1.13.27", "dbt-duckdb==1.11.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
wireless-de = "wireless_de.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
