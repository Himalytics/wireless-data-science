version: 2
sources:
  - name: fcc
    schema: raw
    tables:
      - name: complaints
        description: Validated public FCC records for explicitly ingested date windows.
  - name: operations
    schema: ops
    tables:
      - name: covered_dates
        description: Dates whose complete source extracts passed the row contract.
models:
  - name: stg_complaints
    description: One row per source complaint ID; complaint dates are source calendar dates, not ingestion timestamps.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: complaint_date
        data_tests: [not_null]
      - name: record_sha256
        data_tests: [not_null]
  - name: dim_covered_dates
    columns:
      - name: complaint_date
        data_tests: [unique, not_null]
  - name: fct_wireless_complaints
    description: Public Phone/Internet records where the source method begins with Wireless. This is an explicit classification rule, not a claim about carrier identity.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: issue_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Phone', 'Internet']
      - name: complaint_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_covered_dates')
                field: complaint_date
  - name: daily_wireless_issues
    description: Sparse daily state/issue counts. Missing rows are not themselves evidence of a zero on an unobserved date.
    columns:
      - name: complaint_count
        data_tests: [not_null]
  - name: weekly_wireless_issues
    description: Monday-start calendar weeks with explicit ingestion coverage; incomplete weeks cannot enter priority comparisons.
    columns:
      - name: complaint_count
        data_tests: [not_null]
      - name: covered_days
        data_tests: [not_null]
  - name: issue_priorities
    description: Descriptive triage for the latest pair of consecutive fully covered weeks; no causal or churn inference.
    columns:
      - name: issue
        data_tests: [unique, not_null]
